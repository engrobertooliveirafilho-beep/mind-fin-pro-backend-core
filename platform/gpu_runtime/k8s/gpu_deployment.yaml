apiVersion: apps/v1
kind: Deployment
metadata:
  name: eldora-gpu-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpu-worker
  template:
    metadata:
      labels:
        app: gpu-worker
    spec:
      containers:
      - name: worker
        image: eldora/gpu-worker:latest
        resources:
          limits:
            nvidia.com/gpu: 1
