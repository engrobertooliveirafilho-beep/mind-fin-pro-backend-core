name: ET665 R115 R60 offline regression
on:
  workflow_dispatch:
  push:
    branches:
      - audit/et665-r115-r60-regression-20261108
    paths:
      - 'mind_trader/security/et665_r60_drive_git_reconciliation.py'
      - 'mind_trader/tests/security_review/test_et665_r60_drive_git_reconciliation.py'
      - '.github/workflows/et665-r115-r60-offline.yml'
      - 'mind_trader/tests/security_review/test_et665_r116_paper_capacity_regression.py'
      - 'mind_trader/tests/security_review/et665_r113_paper_capacity_gate.py'
      - 'mind_trader/tests/security_review/test_et665_r119_gateway_interlocks.py'
      - 'mind_trader/security/et665_r122_paper_reconciliation.py'
      - 'mind_trader/security/et665_r124_four_ledger_audit.py'
      - 'mind_trader/tests/security_review/test_et665_r124_four_ledger_audit.py'
      - 'mind_trader/tests/security_review/test_et665_r122_paper_reconciliation.py'
      - 'products/eldora_trader/mind_trader/app/execution/gateway.py'
      - 'products/eldora_trader/mind_trader/app/execution/paper_session.py'
permissions:
  contents: read
jobs:
  r60-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute existing five offline R60 regressions
        run: |
          python -m pip install pytest
          python -m pytest -q mind_trader/tests/security_review/test_et665_r60_drive_git_reconciliation.py mind_trader/tests/security_review/test_et665_r116_paper_capacity_regression.py mind_trader/tests/security_review/test_et665_r119_gateway_interlocks.py mind_trader/tests/security_review/test_et665_r122_paper_reconciliation.py mind_trader/tests/security_review/test_et665_r124_four_ledger_audit.py
