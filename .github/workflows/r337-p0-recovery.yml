name: R337 P0 recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check requirements
        run: |
          test -n "$RCLONE_CONFIG_GDRIVE_TOKEN"
          test -s recovery/r328_drive_zip/queue_p0.jsonl
      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Test
        run: python -m unittest discover -s recovery/r328_drive_zip -p test_recover_all_r335.py
      - name: Recover P0
        run: python recovery/r328_drive_zip/recover_all.py --queue recovery/r328_drive_zip/queue_p0.jsonl --output "$RUNNER_TEMP/recovered"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r337-p0-report
          path: |
            ${{ runner.temp }}/recovered/report.json
            ${{ runner.temp }}/recovered/recovery.jsonl
