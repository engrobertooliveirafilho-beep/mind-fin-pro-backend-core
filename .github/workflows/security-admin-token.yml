name: Admin token fail-closed regression
on:
  push:
    branches:
      - fix/r439-admin-token-failclosed
  pull_request:
    paths:
      - 'app/admin/public_runtime.py'
      - 'tests/security/test_admin_token_failclosed.py'
      - '.github/workflows/security-admin-token.yml'
  workflow_dispatch:
jobs:
  security-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated HTTP test dependencies
        run: python -m pip install fastapi httpx pytest
      - name: Compile source and test
        run: python -m py_compile app/admin/public_runtime.py tests/security/test_admin_token_failclosed.py
      - name: Isolated HTTP route test with blocked database
        run: python -m pytest -q tests/security/test_admin_http_isolated.py
      - name: Isolated negative authentication tests (no network/database)
        run: python -m unittest discover -s tests/security -p 'test_admin_token_failclosed.py' -v
