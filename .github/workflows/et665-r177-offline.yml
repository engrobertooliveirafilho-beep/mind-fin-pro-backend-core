name: ET665 R177 offline regression
on:
  push:
    branches:
      - audit/et665-r177-accepted-order-shape-guard-20261108
    paths:
      - mind_trader/security/et665_r122_paper_reconciliation.py
      - mind_trader/tests/security_review/test_et665_r122_paper_reconciliation.py
      - .github/workflows/et665-r177-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r177-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute five offline regression suites
        run: |
          python -m pip install pytest
          python -m pytest -q mind_trader/tests/security_review/test_et665_r60_drive_git_reconciliation.py mind_trader/tests/security_review/test_et665_r116_paper_capacity_regression.py mind_trader/tests/security_review/test_et665_r119_gateway_interlocks.py mind_trader/tests/security_review/test_et665_r122_paper_reconciliation.py mind_trader/tests/security_review/test_et665_r124_four_ledger_audit.py
