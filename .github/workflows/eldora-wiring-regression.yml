name: Eldora Trader wiring regression

on:
  pull_request:
    paths:
      - "app/runtime/mind_trader_institutional_wiring.py"
      - "tests/test_institutional_wiring_failclosed.py"
      - "tests/test_trader_paper_factory_guard.py"
      - ".github/workflows/eldora-wiring-regression.yml"
  push:
    branches:
      - "engineering/et665-r550-canonical-factory-recovery-20261116"

permissions:
  contents: read

jobs:
  wiring-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify exact Drive-authoritative factory bytes
        run: python -m pytest -q tests/test_trader_paper_factory_guard.py::test_original_factory_bytes_match_drive_authority
      - name: Run fail-closed wiring regressions
        run: python -m unittest discover -s tests -p "test_institutional_wiring_failclosed.py" -v
