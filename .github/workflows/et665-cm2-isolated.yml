name: ET665 CM2 isolated guards
on:
  push:
    branches:
      - audit/et665h-paper-ci-security-review-20261106
    paths:
      - mind_trader/app/p1516_multi_family_combo_backtest_executor/engine.py
      - mind_trader/app/p1525b_cloud_dataset_reconstruction_fix/engine.py
      - mind_trader/app/p153_p155_profit_market_data_pipeline/engine.py
      - mind_trader/app/p156_p1510_real_edge_research_runtime/engine.py
      - mind_trader/reports/P77B_DEMO_ORDER_CHECK_FILLING_MODE_FIX/p77b_filling_check.py
      - mind_trader/reports/P79_DEMO_ORDER_AUDIT_POSITION_MONITOR/p79_monitor.py
      - mind_trader/tests/test_et665_cm2_residual_guards.py
      - .github/workflows/et665-cm2-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Execute only new isolated tests
        run: python -m pytest -q mind_trader/tests/test_et665_cm2_residual_guards.py --junitxml=et665-cm2-junit.xml
      - name: Record evidence SHA-256
        if: always()
        run: sha256sum et665-cm2-junit.xml > et665-cm2-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et665-cm2-evidence
          path: |
            et665-cm2-junit.xml
            et665-cm2-sha256.txt
          if-no-files-found: warn
